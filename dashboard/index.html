<style>
/* 가족여행 대시보드 — 디자인 토큰과 화면 스타일 */
:root {
  --bg: #faf6ef; --surface: #ffffff; --surface2: #fdfaf4; --ink: #2a2520; --muted: #6f675d; --faint: #9a9185;
  --line: #ece2d2; --line2: #f3ebdd; --shadow: 0 1px 2px rgba(60,40,10,.05), 0 6px 20px rgba(60,40,10,.07);
  --shadow-lg: 0 2px 4px rgba(60,40,10,.06), 0 14px 36px rgba(60,40,10,.12);
  --radius: 20px; --radius-sm: 12px;
  --ok: #2b8a57; --ok-soft: #e1f3e8;
  --need: #d97706; --need-soft: #fff0d9;
  --pay: #d6452b; --pay-soft: #ffe4de;
  --chk: #6552d4; --chk-soft: #ece8ff;
  --opt: #7a7266; --opt-soft: #efe9de;
  --sans: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --surface: #1d2128; --surface2: #222730; --ink: #ede9e2; --muted: #a8a195; --faint: #7d776c;
    --line: #2d333d; --line2: #262b34; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    --shadow-lg: 0 2px 4px rgba(0,0,0,.5), 0 14px 36px rgba(0,0,0,.45);
    --ok: #62c590; --ok-soft: #1c3527; --need: #f2a444; --need-soft: #3a2b14; --pay: #ff8a73; --pay-soft: #3d221d;
    --chk: #a99dff; --chk-soft: #272445; --opt: #b3ab9d; --opt-soft: #2a2c30;
    color-scheme: dark;
  }
}
/* 도시별 색 — data-c 로 지정 */
[data-c="paris"] { --c: #5b7fc7; --c-deep: #2f4b8f; --c-soft: #e8eefa; --c-ink: #27427f; }
[data-c="bcn"]   { --c: #f0a22f; --c-deep: #944d06; --c-soft: #fff1d8; --c-ink: #8a4a06; }
[data-c="rome"]  { --c: #d9644f; --c-deep: #a63a2b; --c-soft: #fce6e1; --c-ink: #8e2f22; }
[data-c="air"]   { --c: #3fa39a; --c-deep: #206b65; --c-soft: #ddf3f0; --c-ink: #1b5c57; }
@media (prefers-color-scheme: dark) {
  [data-c="paris"] { --c-soft: #1e2740; --c-ink: #aac1f3; }
  [data-c="bcn"]   { --c-soft: #3a2b12; --c-ink: #f7c677; }
  [data-c="rome"]  { --c-soft: #3b1f1a; --c-ink: #f2a598; }
  [data-c="air"]   { --c-soft: #14312f; --c-ink: #87d4cb; }
}

/* 이동일(두 도시)의 두 번째 색 */
[data-c2="paris"] { --c2: #5b7fc7; --c2-deep: #2f4b8f; --c2-soft: #e8eefa; }
[data-c2="bcn"]   { --c2: #f0a22f; --c2-deep: #944d06; --c2-soft: #fff1d8; }
[data-c2="rome"]  { --c2: #d9644f; --c2-deep: #a63a2b; --c2-soft: #fce6e1; }
[data-c2="air"]   { --c2: #3fa39a; --c2-deep: #206b65; --c2-soft: #ddf3f0; }
@media (prefers-color-scheme: dark) {
  [data-c2="paris"] { --c2-soft: #1e2740; } [data-c2="bcn"] { --c2-soft: #3a2b12; }
  [data-c2="rome"] { --c2-soft: #3b1f1a; } [data-c2="air"] { --c2-soft: #14312f; }
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); letter-spacing: -.01em; padding-bottom: 84px; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 3px solid var(--c, #5b7fc7); outline-offset: 2px; border-radius: 8px; }
.wrap { width: min(1120px, 100% - 32px); margin-inline: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* 상단 바 */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
.brand .logo { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(135deg, #2f4b8f, #c25a5a 70%, #e8a04a); color: #fff; font-size: 18px; }
.nav { display: none; gap: 4px; }
.nav a { padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 15px; color: var(--muted); }
.nav a:hover { background: var(--line2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tabbar { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 24px rgba(60,40,10,.08); }
.tabbar a { display: grid; justify-items: center; gap: 1px; padding: 6px 4px; border-radius: 14px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tabbar a .ic { font-size: 22px; line-height: 1.2; }
.tabbar a[aria-current="page"] { color: var(--ink); background: var(--line2); }
@media (min-width: 720px) { .nav { display: flex; } .tabbar { display: none; } body { padding-bottom: 40px; } }

/* 히어로 */
.hero { position: relative; overflow: hidden; color: #fff; border-radius: 0 0 36px 36px; background: linear-gradient(115deg, #2f4b8f 0%, #5e4a9e 36%, #c25a5a 70%, #e8a04a 100%); }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 12% 18%, rgba(255,255,255,.18), transparent 38%), radial-gradient(circle at 88% 8%, rgba(255,230,170,.22), transparent 30%); }
.hero .art { position: absolute; bottom: -6px; color: #fff; opacity: .16; }
.hero .art svg { display: block; width: 100%; height: auto; }
.hero .a1 { left: 4%; width: clamp(80px, 12vw, 150px); } .hero .a2 { left: 44%; width: clamp(110px, 17vw, 210px); opacity: .12; } .hero .a3 { right: 3%; width: clamp(130px, 20vw, 250px); }
.hero-in { position: relative; display: grid; gap: 22px; padding: 30px 0 54px; }
.eyebrow { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .92; }
.hero h1 { font-size: clamp(30px, 6.4vw, 54px); line-height: 1.15; font-weight: 800; letter-spacing: -.03em; }
.hero .route-line { font-size: clamp(17px, 3vw, 22px); font-weight: 600; opacity: .96; margin-top: 8px; }
.hero .dates { margin-top: 6px; font-size: 15px; opacity: .9; }
.crew { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.crew span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px 6px 8px; border-radius: 999px; background: rgba(255,255,255,.18); font-weight: 700; font-size: 15px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.crew span i { font-style: normal; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.9); font-size: 17px; }
.dday { align-self: end; justify-self: start; padding: 14px 22px; border-radius: 22px; background: rgba(20,16,40,.34); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.22); }
.dday .big { font-size: clamp(38px, 8vw, 58px); font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.dday .small { margin-top: 6px; font-size: 14px; font-weight: 600; opacity: .95; }
@media (min-width: 860px) { .hero-in { grid-template-columns: 1fr auto; align-items: end; padding: 38px 0 60px; } .dday { justify-self: end; } }

/* 섹션 */
main { display: block; }
.sec { margin-top: 34px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sec-h h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.sec-h .hint { font-size: 14px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.pull { margin-top: -28px; position: relative; z-index: 2; }

/* 여행 리본 */
/* 좁은 화면은 도시 3개만 가로 한 줄, 넓은 화면은 인천까지 5개 */
.ribbon { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: start; padding: 14px 8px 12px; }
.ribbon .rb-home, .ribbon .rb-leg.edge { display: none; }
.rb-node { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 8px 2px; border-radius: 16px; min-width: 0; }
a.rb-node:hover { background: var(--c-soft); }
.rb-dot { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 17px; background: var(--c-soft); font-size: 25px; }
.rb-t { font-weight: 800; font-size: 15px; line-height: 1.25; } .rb-s { font-size: 12px; color: var(--muted); }
.rb-n { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--c-soft); color: var(--c-ink); white-space: nowrap; }
.rb-leg { display: grid; justify-items: center; align-self: start; padding-top: 20px; gap: 2px; }
.rb-leg .line { display: none; }
.rb-leg .lab { display: grid; justify-items: center; font-size: 12px; color: var(--muted); font-weight: 700; line-height: 1.3; }
.rb-leg .le { font-size: 20px; } .rb-leg .lt { display: none; }
@media (min-width: 980px) {
  .ribbon { grid-template-columns: auto 1fr auto 1fr auto 1fr auto 1fr auto; align-items: center; padding: 22px 26px; }
  .ribbon .rb-home, .ribbon .rb-leg.edge { display: grid; }
  .rb-node { gap: 8px; padding: 12px 14px; }
  .rb-dot { width: 64px; height: 64px; font-size: 32px; border-radius: 22px; }
  .rb-t { font-size: 18px; } .rb-s { font-size: 14px; } .rb-n { font-size: 13px; padding: 4px 11px; }
  .rb-leg { padding: 0 6px; gap: 4px; align-self: center; }
  .rb-leg .line { display: block; order: 2; width: 100%; height: 0; border-top: 3px dotted var(--faint); }
  .rb-leg .lab { order: 1; display: block; white-space: nowrap; font-size: 14px; }
  .rb-leg .le { font-size: inherit; } .rb-leg .lt { display: inline; }
}

/* 숫자 요약 */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.stat { padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.stat .e { font-size: 26px; line-height: 1.2; } .stat b { display: block; font-size: 19px; line-height: 1.25; font-weight: 800; margin-top: 2px; } .stat span.s { font-size: 13.5px; color: var(--muted); }
@media (min-width: 760px) { .stats { grid-template-columns: repeat(4, 1fr); } }

/* 달력 */
.cal { padding: 18px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.cal-head h3 { font-size: 18px; font-weight: 800; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; margin-right: 5px; font-style: normal; font-size: 11px; font-weight: 800; color: #fff; vertical-align: -3px; }
.dot-ok { background: var(--ok); } .dot-need { background: var(--need); } .dot-chk { background: var(--chk); }
.dotm { display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 800; color: #fff; }
.cal-grid { display: none; }
.cal-grid .dow { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); padding: 2px 0 8px; }
.cell { position: relative; display: flex; flex-direction: column; gap: 4px; min-height: 120px; padding: 9px 10px 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface2); overflow: hidden; transition: transform .15s ease, box-shadow .15s ease; }
.cell.off { background: transparent; border-style: dashed; border-color: var(--line2); color: var(--faint); }
.cell.off .num { color: var(--faint); font-weight: 600; }
a.cell { background: var(--c-soft); border-color: transparent; cursor: pointer; }
a.cell::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--c); }
a.cell.two::before { background: linear-gradient(90deg, var(--c), var(--c2)); }
a.cell.two { background: linear-gradient(135deg, var(--c-soft) 0 50%, var(--c2-soft) 50% 100%); }
a.cell:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
a.cell.today { outline: 3px solid var(--ink); outline-offset: 2px; }
.cell .num { font-size: 19px; font-weight: 800; line-height: 1; color: var(--c-ink); }
.cell .ctop { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.cell .ico { font-size: 22px; line-height: 1.1; }
.cell .lab { margin-top: auto; font-size: 13px; font-weight: 700; line-height: 1.3; color: var(--ink); word-break: keep-all; }
.cell .dotm { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; font-weight: 800; color: #fff; }
.cell .cn { font-size: 11px; font-weight: 700; color: var(--c-ink); opacity: .85; }
.dlist { display: grid; gap: 10px; }
.drow { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; padding: 12px 14px 12px 12px; border-radius: 18px; background: var(--c-soft); border: 1px solid transparent; position: relative; overflow: hidden; }
.drow::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c); }
.drow .dn { text-align: center; line-height: 1.1; padding-left: 4px; } .drow .dn b { display: block; font-size: 22px; font-weight: 800; color: var(--c-ink); } .drow .dn span { font-size: 12px; color: var(--muted); font-weight: 600; }
.drow .tt { font-weight: 800; font-size: 16px; line-height: 1.3; } .drow .ss { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.drow .rt { display: flex; align-items: center; gap: 8px; font-size: 24px; }
.drow .dotm { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 800; color: #fff; }
@media (min-width: 760px) { .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; } .dlist { display: none; } }

/* 홈 2열 */
.cols { display: grid; gap: 18px; }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(0, 2.4fr) minmax(280px, 1fr); align-items: start; } }
.prep { padding: 20px; display: grid; gap: 16px; }
.ring-row { display: flex; align-items: center; gap: 16px; }
.ring { position: relative; width: 92px; height: 92px; flex: none; }
.ring svg { transform: rotate(-90deg); display: block; } .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 800; font-size: 22px; line-height: 1.1; }
.ring .pct small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.prep h3 { font-size: 17px; font-weight: 800; } .prep .sub { font-size: 14px; color: var(--muted); }
.nexts { display: grid; gap: 8px; }
.next { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line2); }
.next .e { font-size: 20px; } .next .tt { font-size: 14.5px; font-weight: 700; line-height: 1.35; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 800; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.need, .pill.wait { background: var(--need-soft); color: var(--need); } .pill.pay { background: var(--pay-soft); color: var(--pay); }
.pill.chk { background: var(--chk-soft); color: var(--chk); } .pill.opt, .pill.todo { background: var(--opt-soft); color: var(--opt); } .pill.late { background: var(--pay-soft); color: var(--pay); } .pill.soon { background: var(--need-soft); color: var(--need); } .pill.far { background: var(--opt-soft); color: var(--opt); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14.5px; background: var(--ink); color: var(--bg); border: 0; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); } .btn.ghost:hover { background: var(--line2); }
.btn.sm { padding: 6px 12px; font-size: 13px; }

/* 도시 카드 */
.cities { display: grid; gap: 16px; }
@media (min-width: 760px) { .cities { grid-template-columns: repeat(3, 1fr); } }
.ccard { display: grid; overflow: hidden; transition: transform .15s ease, box-shadow .15s ease; }
.ccard:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.ccard .cb { position: relative; padding: 18px 18px 56px; color: #fff; background: linear-gradient(140deg, var(--c-deep), var(--c)); overflow: hidden; }
.ccard .cb { background: linear-gradient(140deg, var(--c-deep), color-mix(in srgb, var(--c-deep) 70%, var(--c))); }
.ccard .cb .art { position: absolute; right: 10px; bottom: -8px; width: 120px; opacity: .22; color: #fff; }
.ccard .cb .nm { font-size: 24px; font-weight: 800; letter-spacing: -.02em; } .ccard .cb .en { font-size: 13px; opacity: .9; font-weight: 600; } .ccard .cb .tg { margin-top: 8px; font-size: 14px; font-weight: 600; opacity: .95; }
.ccard .cx { padding: 14px 18px 18px; display: grid; gap: 10px; }
.ccard .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--c-soft); color: var(--c-ink); }
.chip.plain { background: var(--opt-soft); color: var(--muted); }
.ccard .stay { font-size: 14px; color: var(--muted); } .ccard .stay b { color: var(--ink); }
.ccard ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; } .ccard li::before { content: attr(data-e); margin-right: 6px; }

/* 하위 페이지 공통 */
.back { display: inline-flex; align-items: center; gap: 6px; margin: 18px 0 14px; padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.back:hover { color: var(--ink); background: var(--line2); }
.dhero { position: relative; overflow: hidden; color: #fff; border-radius: 28px; padding: 24px 22px 26px; background: linear-gradient(135deg, var(--c-deep), var(--c)); box-shadow: var(--shadow-lg); }
.dhero { background: linear-gradient(135deg, var(--c-deep), color-mix(in srgb, var(--c-deep) 75%, var(--c))); }
.dhero.two { background: linear-gradient(120deg, var(--c-deep), var(--c-deep) 30%, var(--c2-deep) 70%, var(--c2-deep)); }
.dhero .art { position: absolute; right: 14px; bottom: -10px; width: clamp(110px, 22vw, 190px); opacity: .18; color: #fff; }
.dhero .dayn { display: inline-flex; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.22); font-weight: 800; font-size: 13px; letter-spacing: .06em; }
.dhero h1 { margin-top: 12px; font-size: clamp(26px, 5vw, 40px); line-height: 1.2; font-weight: 800; letter-spacing: -.03em; }
.dhero .dd { margin-top: 6px; font-size: 16px; font-weight: 600; opacity: .95; }
.dhero .sm { margin-top: 12px; max-width: 640px; font-size: 16px; opacity: .97; }

  function ribbon() {
    var legs = T.legs, out = "", cs = T.cities;
    function node(c, sub, nt, href, cls, e) {
      var inner = '<span class="rb-dot">' + e + '</span><div class="rbx"><div class="rb-t">' + esc(c) + '</div><div class="rb-s">' + esc(sub) + "</div></div>" + (nt ? '<span class="rb-n">' + esc(nt) + "</span>" : "");
      return href ? '<a class="rb-node" data-c="' + cls + '" href="' + href + '">' + inner + "</a>" : '<div class="rb-node rb-home" data-c="' + cls + '">' + inner + "</div>";
    }
    function leg(l, edge) {
      var p = l.t.split(" · ");
      return '<div class="rb-leg' + (edge ? " edge" : "") + '"><div class="line"></div><div class="lab"><span class="le">' + l.e + '</span> <span class="ld">' + esc(p[0]) + '</span><span class="lt"> · ' + esc(p[1] || "") + "</span></div></div>";
    }
    out += node("인천", "집에서 출발", "", null, "air", "🏠") + leg(legs[0], true);
    cs.forEach(function (c, i) {
      out += node(c.name, ms(c.from) + " ~ " + ms(c.to), c.nights + "박", "#/city/" + c.id, c.cls, c.flag) + leg(legs[i + 1], i === cs.length - 1);
    });
    out += node("인천", "2/17 17:25 도착", "", null, "air", "🏠");
    return '<div class="card ribbon" role="list" aria-label="여행 경로">' + out + "</div>";
  }

  function calendar() {
    var first = new Date(2027, 1, 1), offset = (first.getDay() + 6) % 7, cells = [], i;
    var lastTrip = parse(T.meta.end).getDate();
    var rows = Math.ceil((offset + lastTrip) / 7);
    for (i = 0; i < rows * 7; i++) {
      var dn = i - offset + 1, iso_ = "2027-02-" + pad(dn), day = dn >= 1 && dn <= 28 ? byDate[iso_] : null;
      if (dn < 1 || dn > 28) { cells.push('<div class="cell off"></div>'); continue; }
      if (!day) { cells.push('<div class="cell off"><span class="num">' + dn + '</span></div>'); continue; }
      var two = day.cls2 ? " two" : "", td = iso_ === iso(today()) ? " today" : "";
      cells.push('<a class="cell' + two + td + '" data-c="' + day.cls + '"' + (day.cls2 ? ' data-c2="' + day.cls2 + '"' : "") + ' href="#/day/' + iso_ + '"><span class="ctop"><span class="num">' + dn + "</span>" + dot(dayStatus(day)) + '</span><span class="ico">' + day.icon + '</span><span class="lab">' + esc(day.short) + "</span></a>");
    }
    var dow7 = ["월", "화", "수", "목", "금", "토", "일"].map(function (d) { return '<div class="dow">' + d + "</div>"; }).join("");
    var list = T.days.map(function (day) {
      return '<a class="drow" data-c="' + day.cls + '" href="#/day/' + day.date + '"><div class="dn"><b>' + parse(day.date).getDate() + "</b><span>" + dow(day.date) + '</span></div><div><div class="tt">' + esc(day.short) + '</div><div class="ss">' + esc(day.route) + '</div></div><div class="rt"><span>' + day.icon + "</span>" + dot(dayStatus(day)) + "</div></a>";
    }).join("");
    return '<div class="card cal"><div class="cal-head"><h3>🗓️ 2027년 2월 — 날짜를 눌러 보세요</h3><div class="legend"><span><i class="dot-ok">✓</i>준비 끝</span><span><i class="dot-need">!</i>예매·입금 필요</span><span><i class="dot-chk">?</i>확인할 것</span></div></div><div class="cal-grid" role="grid">' + dow7 + cells.join("") + '</div><div class="dlist">' + list + "</div></div>";
  }

  function prepPanel() {
    var s = bookingStats(), pct = Math.round(s.ok / s.total * 100), r = 38, c = 2 * Math.PI * r;
    var next = openTodos().filter(function (t) { return t.due; }).slice(0, 4).map(function (t) {
      var di = dueInfo(t.due);
      return '<a class="next" href="#/todo"><span class="e">' + t.e + '</span><span class="tt">' + esc(t.title) + '</span><span class="pill ' + di.cls + '">' + di.txt + "</span></a>";
    }).join("");
    return '<div class="card prep"><div class="ring-row"><div class="ring"><svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="46" cy="46" r="' + r + '" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (c * pct / 100).toFixed(1) + " " + c.toFixed(1) + '"/></svg><div class="pct"><div>' + pct + '%<small>' + s.ok + "/" + s.total + '</small></div></div></div><div><h3>준비 현황</h3><p class="sub">예약·예매 ' + s.total + "개 중 " + s.ok + "개가 끝났어요</p></div></div>" +
      '<div><h3 style="font-size:15px;margin-bottom:8px">다가오는 할 일</h3><div class="nexts">' + next + '</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#/todo">할 일 모두 보기</a><a class="btn ghost" href="#/book">예약 현황</a></div></div>';
  }

  function cityCards() {
    return '<div class="cities">' + T.cities.map(function (c) {
      var hl = c.highlights.slice(0, 3).map(function (h) { return '<li data-e="' + h.e + '">' + esc(h.t) + "</li>"; }).join("");
      return '<a class="card ccard" data-c="' + c.cls + '" href="#/city/' + c.id + '"><div class="cb"><div class="art">' + art(c.art) + '</div><div class="nm">' + c.flag + " " + esc(c.name) + '</div><div class="en">' + esc(c.en) + " · " + esc(c.country) + '</div><div class="tg">' + esc(c.tagline) + '</div></div><div class="cx"><div class="meta"><span class="chip">' + ms(c.from) + " ~ " + ms(c.to) + '</span><span class="chip">' + c.nights + '박</span></div><div class="stay">🏨 <b>' + esc(c.stay.name) + '</b></div><ul>' + hl + "</ul></div></a>";
    }).join("") + "</div>";
  }

  function viewHome() {
    var m = T.meta, t0 = today(), start = parse(m.start), end = parse(m.end), big, small, dd = diffDays(start, t0);
    if (dd > 0) { big = "D-" + dd; small = "출발까지 " + dd + "일 · " + md(m.start) + " 출발"; }
    else if (t0 <= end) { big = (diffDays(t0, start) + 1) + "일째"; small = "여행 중이에요! 오늘은 " + md(iso(t0)); }
    else { big = "🎉"; small = "다녀왔어요 · 모두 수고했어요"; }
    var crew = m.travelers.map(function (p) { return "<span><i>" + p.emoji + "</i>" + esc(p.name) + "</span>"; }).join("");
    var nTours = T.bookings.filter(function (b) { return b.cat === "tour"; }).length;
    var nFl = T.bookings.filter(function (b) { return b.cat === "flight"; }).length;
    var nTr = T.bookings.filter(function (b) { return b.cat === "train"; }).length;
    var tOk = T.bookings.filter(function (b) { return b.cat === "tour" && b.st === "ok"; }).length;
    var tPay = T.bookings.filter(function (b) { return b.cat === "tour" && b.st === "pay"; }).length;
    var stats = [["🗓️", "13박 15일", "2/3 ~ 2/17"], ["🏙️", T.cities.length + "개 도시", "3개 나라"], ["✈️", "비행 " + nFl + " · 기차 " + nTr, "이동은 모두 예약 끝"], ["🧑‍🏫", "가이드 투어 " + nTours + "번", "확정 " + tOk + (tPay ? " · 입금 전 " + tPay : "")]]
      .map(function (x) { return '<div class="card stat"><span class="e">' + x[0] + "</span><b>" + x[1] + '</b><span class="s">' + x[2] + "</span></div>"; }).join("");
    return '<section class="hero"><div class="art a1">' + art("eiffel") + '</div><div class="art a2">' + art("sagrada") + '</div><div class="art a3">' + art("colosseum") + '</div><div class="wrap hero-in"><div><div class="eyebrow">✈️ FAMILY TRIP · 2027</div><h1>' + esc(m.title) + '</h1><div class="route-line">' + T.cities.map(function (c) { return c.flag + " " + esc(c.name); }).join(" → ") + '</div><div class="dates">' + md(m.start) + "(" + dow(m.start) + ") ~ " + md(m.end) + "(" + dow(m.end) + ") · " + m.nights + '박</div><div class="crew">' + crew + '</div></div><div class="dday"><div class="big">' + big + '</div><div class="small">' + small + "</div></div></div></section>" +
      '<div class="wrap"><section class="sec pull" aria-label="여행 경로">' + ribbon() + '</section><section class="sec"><div class="stats">' + stats + "</div></section>" +
      '<section class="sec"><div class="sec-h"><h2>한눈에 보는 일정</h2><span class="hint">색깔 = 도시 · 눌러서 자세히</span></div><div class="cols">' + calendar() + prepPanel() + "</div></section>" +
      '<section class="sec"><div class="sec-h"><h2>도시별로 보기</h2><span class="hint">숙소 · 가볼 곳</span></div>' + cityCards() + "</section></div>";
  }

  /* ---------- 하루 ---------- */
  function heroFor(cls, cls2, inner, artId) {
    return '<section class="dhero' + (cls2 ? " two" : "") + '" data-c="' + cls + '"' + (cls2 ? ' data-c2="' + cls2 + '"' : "") + ">" + (artId ? '<div class="art">' + art(artId) + "</div>" : "") + inner + "</section>";
  }
  function viewDay(date) {
    var day = byDate[date];
    if (!day) return notFound();
    var idx = T.days.indexOf(day), prev = T.days[idx - 1], next = T.days[idx + 1];
    var c = city(day.cls), meter = "";
    for (var i = 1; i <= 4; i++) meter += '<i class="' + (i <= day.effort ? "on" : "") + '"></i>';
    var effLabel = ["쉬는 날", "여유로워요", "보통이에요", "조금 힘들어요", "꽉 찬 날이에요"][day.effort];
    var nb = day.events.filter(function (e) { return e.st === "booked"; }).length;
    var facts = '<span class="fact">🚶 <span class="meter">' + meter + "</span> " + effLabel + "</span>" + (day.sunset ? '<span class="fact">🌅 일몰 ' + day.sunset + "</span>" : "") + (nb ? '<span class="fact">✅ 예약 ' + nb + "건</span>" : "") + '<span class="fact">📍 ' + esc(day.route) + "</span>";
    var hero = heroFor(day.cls, day.cls2, '<span class="dayn">DAY ' + day.n + '</span><h1>' + day.icon + " " + esc(day.title) + '</h1><div class="dd">' + md(day.date) + " " + dow(day.date) + '요일</div><p class="sm">' + esc(day.summary) + '</p><div class="facts">' + facts + "</div>", c ? c.art : "");
    var tl = day.events.map(function (e) {
      return '<div class="ev ' + e.st + '"><div class="tm">' + esc(e.t) + '</div><div class="ib">' + e.e + '</div><div class="tx"><h3>' + esc(e.title) + " " + evBadge(e.st) + "</h3>" + (e.d ? "<p>" + esc(e.d) + "</p>" : "") + (e.tag ? '<span class="tag ' + (e.tagType || "") + '">' + esc(e.tag) + "</span>" : "") + (e.map ? '<a class="go" target="_blank" rel="noopener" href="' + mapUrl(e.map) + '">📍 지도에서 보기</a>' : "") + "</div></div>";
    }).join("");
    var side = "";
    if (day.bring && day.bring.length) side += '<section class="card panel"><h2>🎒 꼭 챙겨요</h2><ul class="bring">' + day.bring.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("") + "</ul></section>";
    if (day.notes && day.notes.length) side += '<section class="card panel"><h2>💡 알아두세요</h2><ul class="notes">' + day.notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul></section>";
    function meals(title, list, e) {
      var body = list.length ? '<div class="mgrid">' + list.map(function (m) {
        return '<div class="meal"><div><b>' + esc(m.name) + '</b><div class="mk"><span class="chip plain">' + esc(m.kind) + "</span><span>" + esc(m.price) + '</span></div><div class="mn">' + esc(m.note) + '</div></div><a class="mapb" target="_blank" rel="noopener" href="' + mapUrl(m.q) + '" title="지도에서 보기" aria-label="' + esc(m.name) + ' 지도에서 보기">📍</a></div>';
      }).join("") + "</div>" : '<div class="empty">' + (day.mealNote || "정해 둔 식당이 없어요.") + "</div>";
      return '<section class="card panel"><h2>' + e + " " + title + "</h2>" + body + "</section>";
    }
    var mealHtml;
    if (!day.lunch.length && !day.dinner.length) {
      mealHtml = '<section class="card panel" style="margin-top:18px"><h2>🍽️ 식사</h2><div class="empty">' + esc(day.mealNote || "정해 둔 식당이 없어요.") + "</div></section>";
    } else {
      mealHtml = '<div class="meals">' + meals("점심 후보", day.lunch, "🥪") + meals("저녁 후보", day.dinner, "🍽️") + "</div>";
      if (day.mealNote && day.lunch.length && day.dinner.length) mealHtml += '<p class="empty" style="margin-top:12px">' + esc(day.mealNote) + "</p>";
    }
    var pn = '<nav class="pn" aria-label="이전·다음 날">' + (prev ? '<a href="#/day/' + prev.date + '"><small>← 이전 날 · ' + ms(prev.date) + "</small><b>" + prev.icon + " " + esc(prev.title) + "</b></a>" : "<span></span>") + (next ? '<a class="nx" href="#/day/' + next.date + '"><small>다음 날 · ' + ms(next.date) + " →</small><b>" + next.icon + " " + esc(next.title) + "</b></a>" : "") + "</nav>";
    document.title = ms(day.date) + " " + day.title + " · " + T.meta.title;
    return '<div class="wrap"><a class="back" href="#/">← 전체 일정</a>' + hero + '<div class="two-col" data-c="' + day.cls + '"><section class="card panel"><h2>⏰ 하루 일정</h2><div class="tl">' + tl + '</div></section><div class="side">' + side + "</div></div>" + '<div data-c="' + day.cls + '">' + mealHtml + "</div>" + pn + "</div>";
  }

  /* ---------- 도시 ---------- */
  function viewCity(id) {
    var c = city(id);
    if (!c) return notFound();
    var s = c.stay;
    var hero = heroFor(c.cls, null, '<span class="dayn">' + esc(c.country) + " · " + c.nights + '박</span><h1>' + c.flag + " " + esc(c.name) + '</h1><div class="dd">' + md(c.from) + " ~ " + md(c.to) + '</div><p class="sm">' + esc(c.intro) + "</p>", c.art);
    var hotel = '<section class="card panel hotel"><h2>🏨 숙소</h2><h3>' + esc(s.name) + '</h3><div class="kv"><div><span>동네</span><b>' + esc(s.area) + "</b></div><div><span>주소</span>" + esc(s.address) + "</div><div><span>방</span>" + esc(s.room) + "</div><div><span>체크인</span>" + esc(s.checkin) + "</div>" + (s.checkout ? "<div><span>체크아웃</span>" + esc(s.checkout) + "</div>" : "") + '</div><ul class="facts-l">' + s.facts.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + '</ul><a class="btn sm" target="_blank" rel="noopener" href="' + mapUrl(s.map) + '" style="justify-self:start">📍 지도에서 보기</a></section>';
    var hl = '<section class="card panel"><h2>✨ 가볼 곳</h2><div class="hl">' + c.highlights.map(function (h) { return '<div><span class="e">' + h.e + "</span><span><b>" + esc(h.t) + "</b><p>" + esc(h.d) + "</p></span></div>"; }).join("") + "</div></section>";
    var days = '<section class="card panel"><h2>🗓️ 이 도시에서의 날들</h2><div class="dl-links">' + c.days.map(function (d) { var dy = byDate[d]; return '<a href="#/day/' + d + '"><span style="font-size:26px;text-align:center">' + dy.icon + "</span><span><b>" + ms(d) + "(" + dow(d) + ") " + esc(dy.title) + "</b><small>" + esc(dy.summary) + "</small></span>" + dot(dayStatus(dy)) + "</a>"; }).join("") + "</div></section>";
    var getting = '<section class="card panel"><h2>🚆 오고 가는 길</h2><ul class="facts-l">' + c.getting.map(function (g) { return "<li>" + esc(g) + "</li>"; }).join("") + "</ul></section>";
    document.title = c.name + " · " + T.meta.title;
    return '<div class="wrap" data-c="' + c.cls + '"><a class="back" href="#/">← 전체 일정</a>' + hero + '<div class="two-col"><div class="side">' + hl + days + '</div><div class="side">' + hotel + getting + "</div></div></div>";
  }

  /* ---------- 할 일 ---------- */
  function viewTodo() {
    var open = openTodos(), done = T.todos.filter(function (t) { return t.done; }), late = open.filter(function (t) { var d = dueInfo(t.due); return d && d.n < 0; });
    var groups = {}, order = [];
    open.forEach(function (t) {
      var k = t.due ? (parse(t.due).getFullYear() + "년 " + (parse(t.due).getMonth() + 1) + "월") : "날짜 없음";
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(t);
    });
    function item(t) {
      var di = dueInfo(t.due), cls = t.done ? "done" : (di && di.n < 0 ? "late" : "");
      var right = t.done ? '<span class="pill ok">끝</span>' : (di ? '<span class="pill ' + di.cls + '">' + di.txt + "</span>" : "");
      var sub = (t.due ? ms(t.due) + "(" + dow(t.due) + ") · " : "") + t.who;
      return '<details class="td ' + cls + '"><summary><span class="e">' + t.e + '</span><div><div class="tt">' + esc(t.title) + '</div><div class="ss">' + esc(sub) + "</div></div>" + right + '</summary><div class="bd"><div>' + esc(t.detail) + "</div>" + (t.day ? '<a class="btn ghost sm" style="justify-self:start" href="#/day/' + t.day + '">' + ms(t.day) + " 일정 보기 →</a>" : "") + "</div></details>";
    }
    var html = '<div class="wrap"><div class="sec-h" style="margin-top:26px"><h2>✅ 해야 할 일</h2><span class="hint">눌러서 자세히 · 마지막 업데이트 ' + ms(T.meta.asOf) + "</span></div>";
    if (late.length) html += '<div class="empty" style="margin-bottom:16px;border-style:solid;border-color:var(--pay)">⚠️ 기한이 지난 항목이 ' + late.length + "개 있어요. 아직 안 했는지 아빠에게 확인해 주세요 (이 페이지는 " + ms(T.meta.asOf) + " 기준이에요).</div>";
    order.forEach(function (k) { html += '<section class="group"><h2>' + esc(k) + " <small>" + groups[k].length + '개</small></h2><div class="tds">' + groups[k].map(item).join("") + "</div></section>"; });
    html += '<section class="group"><h2>🎉 이미 끝낸 일 <small>' + done.length + '개</small></h2><div class="tds">' + done.map(item).join("") + "</div></section></div>";
    document.title = "해야 할 일 · " + T.meta.title;
    return html;
  }

  /* ---------- 예약 ---------- */
  function viewBook() {
    var counts = {}, sum = "";
    T.bookings.forEach(function (b) { counts[b.st] = (counts[b.st] || 0) + 1; });
    Object.keys(T.status).forEach(function (k) { if (counts[k]) sum += '<span class="pill ' + T.status[k].cls + '">' + T.status[k].label + " " + counts[k] + "</span>"; });
    var html = '<div class="wrap"><div class="sec-h" style="margin-top:26px"><h2>🎟️ 예약 현황</h2><span class="hint">예약번호는 일부러 넣지 않았어요</span></div><div class="sumbar">' + sum + "</div>";
    T.bookingCats.forEach(function (cat) {
      var list = T.bookings.filter(function (b) { return b.cat === cat.id; });
      if (!list.length) return;
      html += '<section class="group"><h2>' + cat.e + " " + cat.t + " <small>" + list.length + '개</small></h2><div class="bks">' + list.map(function (b) {
        var st = T.status[b.st];
        return '<div class="bk ' + b.st + '"><div class="hd"><span class="e">' + b.e + '</span><div><b>' + esc(b.title) + '</b><div class="sub">' + esc(b.sub) + '</div></div><span class="pill ' + st.cls + '">' + st.label + '</span></div><div class="wh">' + esc(b.when) + '</div><div class="nt">' + esc(b.note) + "</div>" + (b.day ? '<a class="lk" href="#/day/' + b.day + '">' + ms(b.day) + " 일정 보기 →</a>" : "") + "</div>";
      }).join("") + "</div></section>";
    });
    document.title = "예약 현황 · " + T.meta.title;
    return html + "</div>";
  }

  /* ---------- 짐 · 팁 ---------- */
  var KEY = "trip2027.pack.v1";
  function loadPack() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
  function savePack(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* 저장이 막혀도 화면은 동작 */ } }
  function viewPack() {
    var st = loadPack();
    var packs = T.packing.map(function (g) {
      var n = g.items.filter(function (_, i) { return st[g.id + ":" + i]; }).length;
      return '<section class="card pk"><h3><span>' + g.e + " " + esc(g.t) + "</span><small>" + n + "/" + g.items.length + '</small></h3><ul class="chk">' + g.items.map(function (it, i) {
        return '<li><label><input type="checkbox" data-k="' + g.id + ":" + i + '"' + (st[g.id + ":" + i] ? " checked" : "") + "><span>" + esc(it) + "</span></label></li>";
      }).join("") + "</ul></section>";
    }).join("");
    var tips = T.tips.map(function (t) { return '<div class="card tip"><span class="e">' + t.e + "</span><div><b>" + esc(t.t) + "</b><p>" + esc(t.d) + "</p></div></div>"; }).join("");
    document.title = "짐 · 팁 · " + T.meta.title;
    return '<div class="wrap"><div class="sec-h" style="margin-top:26px"><h2>🧳 짐 싸기</h2><button class="btn ghost sm" id="reset">체크 모두 지우기</button></div><p class="hint" style="margin:-6px 0 14px;color:var(--muted);font-size:14px">체크 표시는 이 폰(브라우저)에만 저장돼요. 가족끼리는 따로 체크해요.</p><div class="packs">' + packs + '</div><div class="sec-h" style="margin-top:34px"><h2>💡 알아두면 좋은 것</h2></div><div class="tips">' + tips + "</div></div>";
  }

  function notFound() {
    return '<div class="wrap"><a class="back" href="#/">← 전체 일정</a><div class="empty">찾는 페이지가 없어요. 홈으로 돌아가 주세요.</div></div>';
  }

  /* ---------- 라우터 ---------- */
  function route() {
    var h = (location.hash || "#/").replace(/^#\/?/, ""), p = h.split("/"), html, nav = "home";
    document.title = T.meta.title + " · " + T.meta.subtitle;
    if (p[0] === "day") html = viewDay(p[1]);
    else if (p[0] === "city") html = viewCity(p[1]);
    else if (p[0] === "todo") { html = viewTodo(); nav = "todo"; }
    else if (p[0] === "book") { html = viewBook(); nav = "book"; }
    else if (p[0] === "pack") { html = viewPack(); nav = "pack"; }
    else html = viewHome();
    app.innerHTML = '<div class="view">' + html + '<div class="wrap"><div class="foot"><b>' + esc(T.meta.title) + "</b> · 마지막 업데이트 " + esc(T.meta.asOf) + "<br>가족이 보기 쉽게 정리한 요약이에요. 예약번호·계좌번호 같은 개인 정보는 일부러 넣지 않았고, 정보는 바뀔 수 있어요.</div></div></div>";
    Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function (a) {
      if (a.getAttribute("data-nav") === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    var root = document.documentElement;
    root.style.scrollBehavior = "auto";   // 페이지를 옮길 때는 부드럽게 말고 바로 맨 위로
    window.scrollTo(0, 0);
    root.style.scrollBehavior = "";
  }

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t && t.matches && t.matches('input[type="checkbox"][data-k]')) {
      var st = loadPack(); st[t.getAttribute("data-k")] = t.checked; savePack(st);
      var group = t.getAttribute("data-k").split(":")[0], g = T.packing.filter(function (x) { return x.id === group; })[0];
      var n = g.items.filter(function (_, i) { return st[group + ":" + i]; }).length, h = t.closest(".pk").querySelector("h3 small");
      if (h) h.textContent = n + "/" + g.items.length;
    }
  });
  document.addEventListener("click", function (ev) {
    if (ev.target && ev.target.id === "reset" && confirm("짐 체크 표시를 모두 지울까요?")) { savePack({}); route(); }
  });
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
